<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Изображение товара -->
    <div class="card-image">
      <span class="badge">-20%</span>
      <img src="images/headphones.svg" alt="Беспроводные наушники">
    </div>

    <!-- Информация о товаре -->
    <div class="card-info">
      <h2 class="title">Беспроводные наушники</h2>
      <p class="description">
        Лёгкие наушники с чистым звуком, шумоподавлением и батареей
        на 30 часов работы.
      </p>

      <div class="card-bottom">
        <div class="price">
          <span class="new-price">24 990 ₸</span>
          <span class="old-price">31 190 ₸</span>
        </div>
        <button class="buy-btn" id="buyBtn">Купить</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
